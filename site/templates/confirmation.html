<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #6b7280;
      --accent: #16a34a;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px;
    }
    .container { max-width: 640px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { color: var(--accent); font-size: 1.4rem; margin-top: 0; }
    .order-id { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    a.back { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Thanks, {{ user_name }} — your order is confirmed!</h1>
      <p class="order-id">Order ID: {{ order_id }}<br />A single confirmation email with every item will be sent to {{ user_email }}</p>

      <table>
        <thead>
          <tr><th>Item</th><th>Item #</th><th>Qty</th></tr>
        </thead>
        <tbody>
          {% for item in items %}
            <tr>
              <td>{{ item.item_name }}</td>
              <td>{{ item.item_number }}</td>
              <td>{{ item.quantity }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>

      <a class="back" href="{{ url_for('index') }}">&larr; Place another order</a>
    </div>
  </div>
</body>
</html>
