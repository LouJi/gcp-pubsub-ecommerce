# Cloud Run sets PORT; Spring Boot's server.port picks it up.
server.port=${PORT:8080}

# --- Pub/Sub push verification ---
pubsub.push.audience=${PUBSUB_PUSH_AUDIENCE:}
pubsub.push.service-account=${PUBSUB_PUSH_SERVICE_ACCOUNT:}
pubsub.push.verify-token=${VERIFY_PUSH_TOKEN:true}

# --- SMTP / email ---
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_USE_TLS:true}

app.mail.from-address=${SMTP_FROM_ADDRESS:orders@example.com}

# Structured-ish console logging; Cloud Run ships stdout to Cloud Logging automatically.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
